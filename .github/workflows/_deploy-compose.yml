name: Deploy Compose

on:
  workflow_call:
    secrets:
      ENV_FILE:
        description: 'App .env file contents (passed to the container via env_file)'
        required: false

jobs:
  deploy:
    runs-on: greedylabs
    concurrency:
      group: deploy-eumgil
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          chmod 600 .env

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f
