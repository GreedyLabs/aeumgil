name: Deploy Compose

on:
  workflow_call:
    inputs:
      deploy_env:
        description: 'prod | dev'
        required: true
        type: string
      host_port:
        description: 'Host port to publish'
        required: true
        type: string

jobs:
  deploy:
    runs-on: greedylabs
    concurrency:
      group: deploy-eumgil-${{ inputs.deploy_env }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_ENV: ${{ inputs.deploy_env }}
      HOST_PORT: ${{ inputs.host_port }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: docker compose -p "eumgil-${DEPLOY_ENV}" up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f
