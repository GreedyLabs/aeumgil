name: Build Image

on:
  workflow_call:
    inputs:
      image:
        description: 'Image name without registry (e.g. owner/eumgil-web)'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      tag:
        description: 'Moving tag (e.g. prod, dev)'
        required: true
        type: string
      version:
        description: 'Immutable version suffix (e.g. run number)'
        required: true
        type: string
      no_cache:
        description: 'If true, ignore build cache'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ inputs.image }}-${{ inputs.tag }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ inputs.image }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=${{ inputs.tag }}-${{ inputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no_cache }}
          cache-from: ${{ inputs.no_cache && '' || format('type=gha,scope={0}', inputs.tag) }}
          cache-to: type=gha,mode=max,scope=${{ inputs.tag }}
