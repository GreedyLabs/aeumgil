name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      no_cache:
        description: '빌드 캐시 무시'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ${{ github.repository_owner }}/eumgil-web
      dockerfile: ./Dockerfile
      tag: latest
      version: ${{ github.run_number }}
      no_cache: ${{ inputs.no_cache || false }}

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy-compose.yml
    secrets:
      ENV_FILE: ${{ secrets.ENV_FILE }}
