name: eumgil

services:
  web:
    image: ghcr.io/greedylabs/eumgil-web:${TAG:-latest}
    container_name: eumgil-web
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Seoul
    networks:
      - shared-db
    ports:
      - "5180:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  shared-db:
    external: true
