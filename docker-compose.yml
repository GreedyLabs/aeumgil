# Single compose definition, parameterized per environment.
# The deploy workflows set IMAGE (full ghcr.io ref), DEPLOY_ENV and HOST_PORT,
# and run with a distinct project name (-p eumgil-dev / -p eumgil-prod) so the
# dev and prod stacks coexist on the same host without colliding.
services:
  web:
    image: ${IMAGE:?set IMAGE to the full ghcr.io image ref}
    container_name: eumgil-web-${DEPLOY_ENV:?set DEPLOY_ENV}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:?set HOST_PORT}:3000"
    environment:
      NODE_ENV: production
      DEPLOY_ENV: ${DEPLOY_ENV}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
