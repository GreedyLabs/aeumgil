services:
  web:
    image: ghcr.io/greedylabs/eumgil-web:${TAG:-${DEPLOY_ENV:-prod}}
    container_name: eumgil-web-${DEPLOY_ENV:-prod}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5180}:3000"
    environment:
      NODE_ENV: production
      DEPLOY_ENV: ${DEPLOY_ENV:-prod}
      PORT: "3000"
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
