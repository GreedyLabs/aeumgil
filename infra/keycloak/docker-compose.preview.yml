# 운영 DB와 분리된 임시 테마 검증용. 컨테이너 제거 시 테스트 계정도 사라진다.
services:
  keycloak-theme:
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start-dev", "--import-realm", "--spi-theme--static-max-age=-1", "--spi-theme--cache-themes=false", "--spi-theme--cache-templates=false"]
    ports:
      - "127.0.0.1:8188:8080"
    environment:
      EUMGIL_APP_URL: http://localhost:3000
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./themes/eumgil:/opt/keycloak/themes/eumgil:ro
      - ./eumgil-preview-realm.json:/opt/keycloak/data/import/eumgil-preview-realm.json:ro
