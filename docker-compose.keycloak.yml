# Local-only Keycloak stack for SSO development.
# Run with:
#   docker compose -f docker-compose.keycloak.yml up -d
#
# This is intentionally separate from docker-compose.yml, which is used for the
# deployed web container.

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: eumgil-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6.3}
    container_name: eumgil-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      EUMGIL_APP_URL: http://localhost:3000
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      # 소셜 IdP 브로커 자격증명 — realm import JSON 의 ${SOCIAL_*} 플레이스홀더가
      # 이 env 로 치환된다(Keycloak 기본 동작). 값은 루트 .env 에서 전달.
      SOCIAL_KAKAO_CLIENT_ID: ${SOCIAL_KAKAO_CLIENT_ID:-}
      SOCIAL_KAKAO_CLIENT_SECRET: ${SOCIAL_KAKAO_CLIENT_SECRET:-}
      SOCIAL_NAVER_CLIENT_ID: ${SOCIAL_NAVER_CLIENT_ID:-}
      SOCIAL_NAVER_CLIENT_SECRET: ${SOCIAL_NAVER_CLIENT_SECRET:-}
      SOCIAL_GOOGLE_CLIENT_ID: ${SOCIAL_GOOGLE_CLIENT_ID:-}
      SOCIAL_GOOGLE_CLIENT_SECRET: ${SOCIAL_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./infra/keycloak/import/eumgil-realm.json:/opt/keycloak/data/import/eumgil-realm.json:ro
      - ./infra/keycloak/themes/eumgil:/opt/keycloak/themes/eumgil:ro
      # 커스텀 IdP SPI(네이버) jar — start-dev 는 기동 시 자동 반영한다.
      # jar 는 git 미추적: pnpm keycloak:providers 로 다운로드 (infra/keycloak/README.md)
      - ./infra/keycloak/providers:/opt/keycloak/providers
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  keycloak_db_data:
